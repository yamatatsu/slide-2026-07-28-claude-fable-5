<svg width="100%" viewBox="0 0 680 586" role="img" xmlns="http://www.w3.org/2000/svg" style=""><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">AppSync Events と Yjs によるリアルタイム同期構成</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">複数クライアントが WebSocket で AppSync Events に接続し、onPublish handler 経由で DynamoDB の update log に書き込む。update log から圧縮Lambdaと同期Lambdaが分岐し、圧縮Lambdaは snapshot テーブルを生成、同期Lambdaは snapshot と delta をクライアントへ返す。</desc>
